<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoshi-imo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white">
    <header class="bg-green-900 text-white mx-auto p-4 text-center">
        <h1 class="text-3xl font-bold">Star Potatos</h1>
    <p class="text-sm"> 「一人ひとりのお客様、一杯のコーヒー、そしての一つの芋から」</p>
    <p class="text-sm">本とコーヒーを楽しむ、くつろぎの空間</p>
  
    </header>
  <div class="bg-orange-200 rounded-lg w-1/2 text-center p-4 text-center mx-auto mt-8">
    <h1 class="text-xl font-bold text-purple-400 hover:-translate-y-1">秋の風物　サツマイモフラペチーノ！</h1>
    <p>秋の風物を味わえる、新作フラペチーノです。サツマイモの甘さと、コーヒーの香りが絶妙に調和します。</p>
    <img src="./images/秋色さつまいもフラペチーノ.png" alt="サツマイモフラペチーノ" class="w-48 h-48 object-cover rounded-lg mx-auto mt-4">
    <p class="text-sm text-gray-600 text-right">L:400円　M：300円　S：200円</p>
  </div>
  <div class="bg-stone-200 rounded-lg w-1/2 text-center p-4 text-center mx-auto mt-8">
    <h1 class="text-xl font-bold text-rose-400 hover:-translate-y-1">東京都限定！　ジャーマンポテト</h1>
    <p>東京都限定の特別メニューです。ジャーマンポテトに、本屋喫茶の秘伝の特製ソースをかけた、贅沢な一品です。</p>
    <img src="./images/german-potato.png" alt="ジャーマンポテト" class="w-48 h-48 object-cover rounded-lg mx-auto mt-4">
    <p class="text-sm text-gray-600 text-right">500円</p>
  </div>
  </body>
</html>
